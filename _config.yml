# GitHub Pages build for HyperStrata.
# Safe mode: no custom plugins, no _plugins directory.
title: HyperStrata
description: Experimental local inference for the 8 GB VRAM + 32 GB RAM tier.
theme: jekyll-theme-hacker

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Layout for every page WITHOUT per-file front matter (front matter renders
# as a table on github.com — never put it in content files).
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

# Keep build scratch out of the built site.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
